# Build the Vite PWA and publish dist/ to GitHub Pages.
# Project site: https://gitlgn.github.io/SimAquarium/  (vite.config.js `base`).
name: Deploy to GitHub Pages

on:
  push:
    branches: [modernization]
  workflow_dispatch:

# Allow the deploy job to mint an OIDC token and write the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Typecheck + lint + unit tests — don't publish a broken build.
      - run: npm run check

      - run: npm run build

      # Pages is already enabled for this repo (done once via the REST API —
      # `enablement: true` here needs a token beyond GITHUB_TOKEN). This step
      # just reads the site config.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # dist/.well-known/assetlinks.json — without this, v4+ tars exclude
          # every dotfile/dotfolder and the Android asset-links file vanishes.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
